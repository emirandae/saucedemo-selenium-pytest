[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short -p no:cacheprovider --html=reports/reporte.html --self-contained-html --junitxml=reports/junit.xml
junit_family = xunit2
markers =
    caso(id): identificador del caso de prueba en la matriz de casos (CP-01 a CP-09)
    humo: pruebas de humo del flujo principal
    login: autenticación
    catalogo: catálogo de productos
    carrito: carrito de compras
    checkout: proceso de compra
    sesion: cierre de sesión y protección de rutas
